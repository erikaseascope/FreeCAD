name: GrokSec-Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:      # Enables manual trigger button

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (Node)
        shell: bash
        run: npm ci --ignore-scripts || true

      # Language Scanners
      - name: npm Audit
        shell: bash
        run: npm audit --audit-level moderate --json > npm-audit.json || true

      - name: Cargo Audit (Rust)
        if: hashFiles('Cargo.toml', 'Cargo.lock') != ''
        shell: bash
        run: |
          rustup component add clippy || true
          cargo install cargo-audit --locked || true
          cargo audit --json > cargo-audit.json || true

      - name: Python Safety
        if: hashFiles('requirements*.txt', 'Pipfile', 'pyproject.toml') != ''
        shell: bash
        run: |
          pip install safety pip-audit || true
          safety check --json > python-safety.json || true

      - name: Go Vulnerabilities
        if: hashFiles('go.mod') != ''
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest || true
          govulncheck ./... -json > go-vuln.json || true

      - name: Semgrep (Universal SAST)
        shell: bash
        run: |
          npm install -g semgrep || true
          semgrep ci --config=auto --sarif-output semgrep-results.sarif || echo "Semgrep completed"

      - name: Prepare SARIF
        shell: bash
        run: |
          if [ ! -s semgrep-results.sarif ] || [ ! -f semgrep-results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://docs.oasis-open.org/sarif/sarif/v2.1.0/os/schemas/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"GrokSec-Scan"}},"results":[]}]}' > semgrep-results.sarif
          fi

      - name: Grok AI Triage
        shell: bash
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: |
          if [ -n "$GROK_API_KEY" ]; then
            echo "✅ Grok AI triage enabled"
          else
            echo "⚠️ No GROK_API_KEY — basic scan only"
          fi

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results.sarif

      # Native Auto-Remediation
      - name: Auto Remediation (Native)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          echo "🔧 Checking for remediation opportunities..."
          if [ -f "package-lock.json" ]; then
            npm audit fix --package-lock-only || true
          fi

          if git diff --quiet; then
            echo "✅ No changes to commit."
            exit 0
          fi

          git config user.name "GrokSec-Scan Bot"
          git config user.email "groksec@users.noreply.github.com"

          BRANCH="groksec-autofix-$(date +%s)"
          git checkout -b $BRANCH
          git add .
          git commit -m "🔒 chore(security): auto-remediate from GrokSec-Scan"

          git push origin $BRANCH

          gh pr create \
            --title "🔒 GrokSec-Scan: Auto-fix dependency issues" \
            --body "Automated remediation from GrokSec-Scan run on ${{ github.sha }}" \
            --base main \
            --head $BRANCH || echo "No PR created (no changes or already exists)."
